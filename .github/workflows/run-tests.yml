name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run pytest for all tests
      run: |
        pytest -v ex1_test_clean.py
        pytest -v ex2_test_normalize.py
        pytest -v ex3_test_evaluate.py
        pytest -v ex5_test_pipeline.py   # ⬅️ NEW TEST ADDED
